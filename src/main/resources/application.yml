spring:
  application:
    name: campusdesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusdesk}
    username: ${DB_USER:campusdesk}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.boot: INFO
    org.springframework.core: INFO
    org.springframework.jdbc: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
app:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS:}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${ADMIN_NAME:Campus Administrator}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  demo:
    enabled: ${DEMO_ENABLED:false}
    password: ${DEMO_PASSWORD:}
